[project]
name = "shifts-generator"
version = "0.1.0"
description = "A library to generate monthly shifts for teams of physicians in a hospital ward"
readme = "README.md"
authors = [
    { name = "Sara", email = "sara.beggiato.90@gmail.com" },
    { name = "Beatrice", email = "saggiorato.beatrice@gmail.com"}
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
shifts-generator = "shifts_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dayplot>=0.6.0",
    "matplotlib>=3.11.2",
    "ortools>=9.15.6755",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
frontend = [
    "streamlit>=1.65.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [ "playgrounds" ]  # for now at least

[tool.ruff.lint]
select = [
  "E","F","W",          # pycodestyle/pyflakes
  "I",                  # isort (imports) 
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "C4",                 # flake8-comprehensions
  "SIM",                # flake8-simplify
  "RET",                # flake8-return
  "ARG",                # flake8-unused-arguments
  "N",                  # pep8-naming
  "PL",                 # Pylint rules (ported)
  "C90",                # mccabe cyclomatic complexity (C901)
]

# Cyclomatic complexity (C901)
[tool.ruff.lint.mccabe]
max-complexity = 8

# “Size/shape” limits, via Pylint-ported rules
[tool.ruff.lint.pylint]
max-args = 10            # PLR0913
max-statements = 75      # PLR0915  ~ proxy for "LOC per function"
max-public-methods = 15  # PLR0904
max-nested-blocks = 3    # PLR1702  ~ your nesting-depth goal