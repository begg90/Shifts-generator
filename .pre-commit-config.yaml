default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: pyrefly
        name: pyrefly
        entry: uv run --locked pyrefly check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]