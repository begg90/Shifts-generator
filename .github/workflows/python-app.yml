# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Shifts-generator test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
          version: "0.12.23"

    - name: Set up Python 3.14          # alternatively: run: uv python install
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install the project
      run: uv sync --locked --all-extras

    - name: Lint with ruff (blocking)
      run: uv run --locked ruff check --output-format=github .

    - name: Type check
      run: uv run --locked pyrefly check --output-format=github .

    - name: Test with pytest
      run: uv run --with pytest --with pytest-cov pytest --cov-report "xml:coverage.xml" --cov=.

    - name: Create Coverage
      if: ${{ github.event_name == 'pull_request' }}
      uses: orgoro/coverage@v3
      with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
