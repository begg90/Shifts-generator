[project]
name = "shifts-generator"
version = "0.1.0"
description = "A webapp to generate monthly shifts for teams of physicians in a hospital ward"
readme = "README.md"
authors = [
    { name = "Sara", email = "sara.beggiato.90@gmail.com" },
    { name = "Beatrice", email = "saggiorato.beatrice@gmail.com"}
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
shifts-generator = "shifts_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ortools>=9.15.6755",
    "ruff>=0.17.0",
    "streamlit>=1.65.0",
]
