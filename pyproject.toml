[project]
name = "shifts-generator"
version = "0.1.0"
description = "A library to generate monthly shifts for teams of physicians in a hospital ward"
readme = "README.md"
authors = [
    { name = "Sara", email = "sara.beggiato.90@gmail.com" },
    { name = "Beatrice", email = "saggiorato.beatrice@gmail.com"}
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
shifts-generator = "shifts_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dayplot>=0.6.0",
    "matplotlib>=3.11.2",
    "ortools>=9.15.6755",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
    "sphinx-autodoc-typehints>=3.17.5",
]
frontend = [
    "streamlit>=1.65.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
force-exclude = true
exclude = [ "playgrounds" ]  # for now at least

[tool.ruff.lint]
select = [
  "E","F","W",          # pycodestyle/pyflakes
  "I",                  # isort (imports) 
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "C4",                 # flake8-comprehensions
  "SIM",                # flake8-simplify
  "RET",                # flake8-return
  "ARG",                # flake8-unused-arguments
  "N",                  # pep8-naming
  "PL",                 # Pylint rules (ported)
  "C90",                # mccabe cyclomatic complexity (C901)
  "D1",                 # missing docstrings on public names
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/shifts_generator/*/__init__.py" = ["D104"]

# Cyclomatic complexity (C901)
[tool.ruff.lint.mccabe]
max-complexity = 8

# “Size/shape” limits, via Pylint-ported rules
[tool.ruff.lint.pylint]
max-args = 10            # PLR0913
max-statements = 75      # PLR0915  ~ proxy for "LOC per function"
max-public-methods = 15  # PLR0904
max-nested-blocks = 5    # PLR1702  ~ your nesting-depth goal

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
preset = "strict"

[[tool.pyrefly.sub-config]]
# apply this config to all files in `playgounds`
matches = "playgrounds/**"

# disable errors in `playgounds`
[tool.pyrefly.sub-config.errors]
missing-import = false
implicit-any-parameter = false
bad-argument-type = false
implicit-any-lambda = false
