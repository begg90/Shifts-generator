name: Set up project
description: Install uv and python

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: "0.12.23"

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"