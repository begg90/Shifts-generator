[project]
name = "shifts-generator"
version = "0.1.0"
description = "A library to generate monthly shifts for teams of physicians in a hospital ward"
readme = "README.md"
authors = [
    { name = "Sara", email = "sara.beggiato.90@gmail.com" },
    { name = "Beatrice", email = "saggiorato.beatrice@gmail.com"}
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
shifts-generator = "shifts_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dayplot>=0.6.0",
    "matplotlib>=3.11.2",
    "ortools>=9.15.6755",
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
frontend = [
    "streamlit>=1.65.0",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "default"
