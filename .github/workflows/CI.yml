name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
          version: "0.12.23"

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install the project
      run: uv sync --locked --all-groups --no-group docs

    - name: Lint with ruff
      run: uv run --locked ruff check --output-format=github .

    - name: Check format with ruff
      run: uv run --locked ruff format --check --diff .

    - name: Type check
      run: uv run --locked pyrefly check --output-format=github .  


  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write 
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
          version: "0.12.23"

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install the project
      run: uv sync --locked --all-groups --no-group docs

    - name: Test with pytest
      run: uv run --locked pytest --cov-report "xml:coverage.xml" --cov=.

    - name: Create Coverage
      if: ${{ github.event_name == 'pull_request' }}
      uses: orgoro/coverage@v3
      with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}


  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
          version: "0.12.23"

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install the project
      run: uv sync --locked --group docs  

    - name: Built documentation
      run: uv run --locked sphinx-build -W -b html docs/source docs/_build/html

